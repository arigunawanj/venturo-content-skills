<title>/*TITLE*/</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;0,900;1,500;1,600&display=swap">
<style>
/* =====================================================================
   VENTURO PLAYER — preview tanpa render + sumber render frame-by-frame.
   Panggung 1080×1920 (9:16) atau 1920×1080 (16:9), diskalakan ke layar.
   Bahasa visual: carousel IG Venturo (lihat references/design-system.md).
   ===================================================================== */
:root {
  --ink: #1E2A2E; --body: #46555A; --muted: #7C8B90; --teal: #168897; --tealD: #0F6F7A; --green: #4CBD8A; --lime: #8FCB6B;
  --tag: #DCE5E8; --soft: #F1F4F5; --line: #E3EAEC; --okbg: #EEF8F1; --dark: #1F2B2F; --red: #E5484D;
  --page: #E7EDEE; --panel: #FFFFFF;
  --font: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--page); color: var(--ink); font-family: var(--font); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; box-sizing: border-box; }
[hidden] { display: none !important; }
.app { display: flex; flex-direction: column; align-items: center; gap: 12px; height: 100%; }
.stagewrap { position: relative; border-radius: 18px; overflow: hidden; box-shadow: 0 20px 50px -20px rgba(30,42,46,.35); background: #fff; flex: none; }
#stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: #fff; }
.controls { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 12px; }
#play { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--teal); color: #fff; font-size: 18px; cursor: pointer; flex: none; box-shadow: 0 4px 0 var(--tealD); }
#play:focus-visible, .chips button:focus-visible, #scrub:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; }
#scrub { flex: 1; min-width: 0; accent-color: var(--teal); }
#time { font: 600 13px var(--font); color: var(--body); font-variant-numeric: tabular-nums; min-width: 86px; text-align: right; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1.5px solid var(--line); background: var(--panel); color: var(--body); font: 600 12px var(--font); padding: 5px 10px; border-radius: 20px; cursor: pointer; }
.chips button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.note { font: 500 12px var(--font); color: var(--muted); text-align: center; }
#bigplay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; cursor: pointer; }
#bigplay span { width: 84px; height: 84px; border-radius: 50%; background: var(--teal); color: #fff; font-size: 30px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 var(--tealD), 0 20px 40px -10px rgba(0,0,0,.35); padding-left: 6px; }
body.render { padding: 0; background: #fff; } body.render .controls, body.render #bigplay { display: none !important; }
body.render .stagewrap { border-radius: 0; box-shadow: none; }

/* ---------- komponen panggung (koordinat px pada kanvas 1080 lebar) ---------- */
.slide { position: absolute; inset: 0; display: none; overflow: hidden; will-change: transform; }
.slide.mg { background: #fff; }
/* pola biner template: hanya pojok kanan atas & kiri bawah, memudar ke tengah */
.slide.mg::before { content: ''; position: absolute; inset: 0; background: url(media/bg.jpg) center/cover no-repeat; opacity: .85;
  -webkit-mask-image: radial-gradient(ellipse 75% 45% at 100% 0%, #000 0%, rgba(0,0,0,.5) 45%, transparent 100%), radial-gradient(ellipse 75% 45% at 0% 100%, #000 0%, rgba(0,0,0,.5) 45%, transparent 100%);
          mask-image: radial-gradient(ellipse 75% 45% at 100% 0%, #000 0%, rgba(0,0,0,.5) 45%, transparent 100%), radial-gradient(ellipse 75% 45% at 0% 100%, #000 0%, rgba(0,0,0,.5) 45%, transparent 100%); }
#track { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #fff; }
.slide video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #ddd; }
.slide video.bv { position: static; display: block; width: 100%; height: 100%; border-radius: 18px; }
.bcard { padding: 14px; } .bcard .src { font: italic 500 22px var(--font); color: var(--muted); margin: 12px 6px 2px; letter-spacing: 1px; }
.chipf { padding: 12px 26px; border-radius: 30px; background: rgba(255,255,255,.94); font: 700 28px var(--font); color: var(--ink); box-shadow: 0 8px 24px -10px rgba(30,42,46,.35); white-space: nowrap; display: inline-flex; gap: 12px; align-items: center; }
.chipf i { width: 16px; height: 16px; border-radius: 4px; background: var(--teal); display: block; }
.abs { position: absolute; }
.logo { left: 80px; top: 232px; width: 300px; } .logo img { width: 100%; display: block; }
.counter { left: 846px; top: 246px; padding: 8px 26px; border: 2.5px solid #D3DCDF; border-radius: 40px; font: 600 30px var(--font); color: var(--ink); background: rgba(255,255,255,.85); }
.lbl { left: 80px; top: 360px; display: flex; align-items: center; gap: 16px; font: italic 500 30px var(--font); letter-spacing: 4px; color: var(--body); text-transform: uppercase; }
.lbl i { width: 22px; height: 22px; border-radius: 5px; background: var(--teal); display: block; }
.tag { padding: 10px 26px; border-radius: 30px; background: var(--tag); font: 800 30px var(--font); letter-spacing: 3px; color: var(--body); }
.h1 { left: 80px; top: 412px; width: 920px; font: 800 96px/1.04 var(--font); letter-spacing: -2.5px; color: var(--ink); text-wrap: balance; }
.h1 .w { display: inline-block; } .h1.teal { color: var(--teal); }
.h2 { left: 80px; width: 920px; font: 700 60px/1.15 var(--font); letter-spacing: -1px; color: var(--teal); }
.body { font: 500 38px/1.4 var(--font); color: var(--body); }
.strike { position: relative; } .strike::after { content: ''; position: absolute; left: -6px; right: -6px; top: 52%; height: 8px; background: var(--teal); border-radius: 4px; transform-origin: 0 50%; transform: scaleX(var(--k, 1)); }
.card { background: #fff; border-radius: 22px; box-shadow: 0 2px 0 rgba(30,42,46,.04), 0 16px 40px -14px rgba(30,42,46,.22); }
.pill { padding: 18px 40px; border-radius: 50px; font: 800 44px var(--font); white-space: nowrap; color: #fff; }
.pill.t { background: var(--tealD); } .pill.g { background: var(--green); color: var(--ink); } .pill.l { background: var(--lime); color: var(--ink); }
.caps { font: italic 500 26px var(--font); letter-spacing: 4px; color: var(--body); text-transform: uppercase; }
.panel { background: var(--dark); color: #fff; border-radius: 22px; padding: 30px 40px; }
.panel .caps { color: var(--lime); } .panel .tx { font: 800 44px/1.3 var(--font); margin-top: 10px; } .panel .tx em { font-style: normal; color: var(--lime); }
.chat { width: 590px; padding: 30px 30px 34px; }
.chat .hd { display: flex; align-items: center; gap: 18px; margin-bottom: 18px; }
.chat .av { width: 64px; height: 64px; border-radius: 50%; background: #E3F1F3; display: flex; align-items: center; justify-content: center; }
.chat .av svg { width: 36px; height: 36px; fill: none; stroke: var(--teal); stroke-width: 2.4; }
.chat .nm { font: 800 36px var(--font); color: var(--ink); } .chat .st { font: 500 26px var(--font); color: var(--muted); }
.bub { background: var(--soft); border-radius: 16px; padding: 18px 24px; font: 600 31px/1.3 var(--font); color: var(--ink); margin-top: 16px; width: fit-content; max-width: 500px; }
.bub:nth-child(odd) { margin-left: 30px; }
.item { width: 860px; height: 160px; display: flex; align-items: center; gap: 30px; padding: 0 36px; }
.item .ic { width: 96px; height: 96px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }
.item .ic svg { width: 50px; height: 50px; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.item .tt { font: 800 46px var(--font); color: var(--ink); letter-spacing: -.5px; } .item .ss { font: 500 31px var(--font); color: var(--body); margin-top: 4px; }
.tbl { width: 920px; padding: 30px 30px 34px; }
.tbl .tr { display: grid; grid-template-columns: 190px 1fr 1fr; gap: 16px; align-items: stretch; margin-top: 16px; }
.tbl .th { font: 700 26px var(--font); letter-spacing: 3px; color: var(--muted); align-self: center; }
.tbl .hp { border-radius: 40px; text-align: center; padding: 12px 10px; font: 800 28px var(--font); letter-spacing: 1px; }
.tbl .hp.x { background: var(--tag); color: var(--body); } .tbl .hp.v { background: var(--tealD); color: #fff; }
.tbl .k { font: 800 36px var(--font); color: var(--ink); align-self: center; }
.tbl .c { border-radius: 16px; padding: 22px 24px; font: 600 31px/1.25 var(--font); }
.tbl .c.x { background: var(--soft); color: var(--body); } .tbl .c.v { background: var(--okbg); border: 3px solid var(--lime); color: var(--ink); font-weight: 700; }
/* caption footage: kotak putih per baris, kata aktif teal, kata berikutnya abu */
.cap { left: 80px; top: 1330px; width: 870px; font: 800 60px/1.42 var(--font); letter-spacing: -1px; }
.cap span.line { background: #fff; color: var(--ink); padding: 4px 20px; border-radius: 12px; box-decoration-break: clone; -webkit-box-decoration-break: clone; box-shadow: 0 8px 24px -10px rgba(30,42,46,.35); }
.cap .w { color: var(--ink); } .cap .w.next { color: #A8B4B8; } .cap .w.on { color: var(--teal); }
/* 16:9: geser zona */
.wide .logo { left: 90px; top: 70px; width: 260px; } .wide .counter { left: auto; right: 90px; top: 78px; }
.wide .lbl { left: 90px; top: 190px; } .wide .h1 { left: 90px; top: 240px; width: 1100px; } .wide .cap { left: 90px; top: 880px; width: 1300px; }
/*CSS*/
</style>

<div class="app">
  <div class="stagewrap" id="wrap">
    <div id="stage"></div>
    <button id="bigplay" aria-label="Putar video"><span>▶</span></button>
  </div>
  <div class="controls">
    <div class="row">
      <button id="play" aria-label="Putar atau jeda">▶</button>
      <input id="scrub" type="range" min="0" step="0.01" value="0" aria-label="Posisi video">
      <div id="time">0:00</div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="note">Preview langsung di browser, belum dirender jadi video. Klik nama scene untuk lompat.</div>
  </div>
</div>

<script>
const DATA = /*DATA*/;
const W = DATA.w || 1080, H = DATA.h || 1920, TR = 0.38;   // TR = durasi geser antar slide
const RENDER = new URLSearchParams(location.search).has('render');
const $ = (q, r = document) => r.querySelector(q);
const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const EZ = {
  out: t => 1 - Math.pow(1 - t, 3),
  expo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  back: t => { const c = 1.7, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  lin: t => t,
};
/** progress 0..1 dari detik a ke b */
const P = (t, a, b, e = 'out') => EZ[e](cl((t - a) / Math.max(1e-6, b - a)));
function tf(el, { x = 0, y = 0, s = 1, r = 0, o = 1 } = {}) { if (!el) return; el.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`; el.style.opacity = cl(o); }
/** elemen masuk: from 'up' | 'left' | 'right' | 'pop' ; r = rotasi akhir (kartu/pill miring) */
function enter(el, t, at, { from = 'up', d = 50, dur = .5, r = 0, x = 0, y = 0 } = {}) {
  if (!el) return;
  const k = P(t, at, at + dur, from === 'pop' ? 'back' : 'expo');
  const o = { o: P(t, at, at + dur * .45), r, x, y };
  if (from === 'up') o.y = y + (1 - k) * d; if (from === 'left') o.x = x - (1 - k) * d; if (from === 'right') o.x = x + (1 - k) * d;
  if (from === 'pop') o.s = lerp(.4, 1, k);
  tf(el, o);
}
/** garis SVG digambar: path butuh pathLength="1" + stroke-dasharray:1 */
const draw = (el, k) => { if (el) el.style.strokeDashoffset = 1 - cl(k); };
const SEG = DATA.segs, TOTAL = DATA.total;
const byId = Object.fromEntries(SEG.map(s => [s.id, s]));
const norm = w => w.toLowerCase().normalize('NFKD').replace(/[^a-z0-9%]/g, '');
/** detik LOKAL segmen saat kata q diucapkan (nth = kemunculan ke-n) */
function wd(id, q, nth = 0) { let n = 0; for (const w of byId[id].words || []) if (norm(w.w).startsWith(norm(q))) { if (n === nth) return w.s; n++; } return 0; }
function wEnd(id, q, nth = 0) { let n = 0; for (const w of byId[id].words || []) if (norm(w.w).startsWith(norm(q))) { if (n === nth) return w.e; n++; } return 0; }

const LOGO = `<div class="abs logo" data-r="logo"><img src="media/logo.png" alt="Venturo Expert Programmers"></div>`;
const LBL = txt => `<div class="abs lbl" data-r="lbl"><i></i>${txt}</div>`;
const CNT = txt => `<div class="abs counter" data-r="cnt">${txt}</div>`;
/** rekaman orang bicara sudah ada di trek utama (#track, lapisan paling bawah) → slide footage cukup transparan */
const VIDEO = s => ``;
/** B-roll di dalam kartu (id dari "broll" di script.json). off = detik awal di klip */
const BROLL = (id, off = 0, cls = '') => `<video class="bv ${cls}" data-off="${off}" muted playsinline preload="auto" src="media/${id}.mp4"></video>`;
const words = (txt, cls = '') => txt.split(' ').map(w => `<span class="w ${cls}" data-r="hw[]">${w}</span>`).join(' ');
function refs(root) { const r = {}; root.querySelectorAll('[data-r]').forEach(el => { const k = el.dataset.r; if (k.endsWith('[]')) (r[k.slice(0, -2)] ||= []).push(el); else r[k] = el; }); return r; }
/** header slide: logo, label, counter masuk berurutan */
function head(r, t, at = 0) {
  enter(r.logo, t, at, { from: 'up', d: 20, dur: .4 });
  if (r.lbl) enter(r.lbl, t, at + .1, { from: 'left', d: 40 });
  if (r.cnt) enter(r.cnt, t, at + .1, { from: 'pop', dur: .35 });
}
const ICON = {
  user: `<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-6 8-6s7 1.5 8 6"/></svg>`,
  target: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg>`,
  flow: `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="6" rx="1.5"/><rect x="14" y="15" width="7" height="6" rx="1.5"/><path d="M10 6h7v9"/></svg>`,
  flag: `<svg viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h12l-2.5 4L17 12H5"/></svg>`,
  book: `<svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>`,
  file: `<svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h6"/></svg>`,
  chat: `<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>`,
  send: `<svg viewBox="0 0 24 24"><path d="M3 11.5 21 3l-8.5 18-2.2-7.3z"/></svg>`,
  check: `<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>`,
};

/* ---------- caption footage (kata waktu lokal segmen) ---------- */
function chunksOf(s) {
  const out = []; let cur = null;
  (s.words || []).forEach(w => {
    if (!cur) cur = { s: w.s, words: [] }; cur.words.push(w);
    const len = cur.words.reduce((a, b) => a + b.w.length + 1, 0);
    if (/[.,!?:]$/.test(w.w) || cur.words.length >= 3 || len > 19) { out.push(cur); cur = null; }
  });
  if (cur) out.push(cur);
  out.forEach((c, i) => { const n = out[i + 1]; c.e = n ? n.s : Math.min(c.words.at(-1).e + .4, s.dur); });
  return out;
}
function caption(el, s, lt) {
  if (!el) return; s.ch ||= chunksOf(s);
  const c = s.ch.find(c => lt >= c.s && lt < c.e);
  if (!c) { el.innerHTML = ''; return; }
  let a = c.words.findIndex(w => lt >= w.s && lt < w.e); if (a < 0) a = c.words.filter(w => lt >= w.s).length - 1;
  el.innerHTML = `<span class="line">${c.words.map((w, i) => `<span class="w ${i === a ? 'on' : i > a ? 'next' : ''}">${w.w}</span>`).join(' ')}</span>`;
  const k = P(lt, c.s, c.s + .25, 'expo'); el.style.transform = `translateY(${lerp(18, 0, k)}px)`; el.style.opacity = P(lt, c.s, c.s + .1);
}
/** scene footage standar: video + logo + caption (caption:false di script.json bila ada grafik yang sudah memuat kata yang sama) */
const footScene = () => ({
  build: (el, s) => el.innerHTML = VIDEO(s) + (s.logo === false ? '' : LOGO) + (s.caption === false ? '' : `<div class="abs cap" data-r="cap"></div>`),
  update(r, t, s) { enter(r.logo, t, .05, { from: 'up', d: 20, dur: .4 }); caption(r.cap, s, t); },
});

/* =================== SCENE PROYEK =================== */
const SC = {};
/*SCENES*/
/* ==================================================== */

/* ---------- mesin player ---------- */
const stage = $('#stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px'; if (W > H) stage.classList.add('wide');
/* trek utama: semua footage + seluruh audio dalam satu file → gambar & suara pasti sinkron, dan jadi jam player */
const track = document.createElement('video');
track.id = 'track'; track.playsInline = true; track.preload = 'auto'; track.src = RENDER ? '../build/track-hd.mp4' : 'media/track.mp4';
if (RENDER) track.muted = true;
stage.appendChild(track);
SEG.forEach((s, i) => {
  const el = document.createElement('section'); el.className = 'slide ' + (s.kind === 'mg' || s.slide ? 'mg' : 'ft'); stage.appendChild(el);
  const def = SC[s.id] || (s.kind === 'ft' ? footScene() : { build: e => e.innerHTML = LOGO + `<div class="abs h1">${s.id}</div>`, update: (r, t) => head(r, t) });
  s.def = def; def.build(el, s); s.el = el; s.r = refs(el); s.vids = [...el.querySelectorAll('video')];
  s.swipe = s.swipe ?? (i > 0 && (s.kind === 'mg' || SEG[i - 1].kind === 'mg'));   // geser ala carousel
});
const scrub = $('#scrub'), playBtn = $('#play'), big = $('#bigplay');
scrub.max = TOTAL;
let playing = false, clockT = 0;
const now = () => playing ? track.currentTime : clockT;
function segAt(t) { let i = 0; SEG.forEach((s, k) => { if (t >= s.t0) i = k; }); return i; }
function syncVideo(s, lt, live) {
  for (const v of s.vids) {
    const lim = (isFinite(v.duration) && v.duration > 0 ? v.duration : s.dur) - .04;
    const tgt = cl(lt + (+v.dataset.off || 0), 0, lim);
    if (live) { if (v.paused) v.play().catch(() => {}); if (Math.abs(v.currentTime - tgt) > .15) v.currentTime = tgt; }
    else { if (!v.paused) v.pause(); if (RENDER || Math.abs(v.currentTime - tgt) > .03) v.currentTime = tgt; }
  }
}
function render(t) {
  t = cl(t, 0, TOTAL); const i = segAt(t), s = SEG[i], lt = t - s.t0;
  const sw = s.swipe && lt < TR ? EZ.io(lt / TR) : 1;
  SEG.forEach((x, k) => {
    const on = k === i || (k === i - 1 && sw < 1);
    x.el.style.display = on ? 'block' : 'none';
    if (!on) { x.vids.forEach(v => { if (!v.paused) v.pause(); }); return; }
    const xlt = t - x.t0;
    x.el.style.transform = k === i ? `translateX(${(1 - sw) * W}px)` : `translateX(${-sw * W}px)`;
    x.def.update(x.r, Math.min(xlt, x.dur), x);
    syncVideo(x, Math.min(xlt, x.dur), playing && k === i);
  });
  scrub.value = t; const f = v => `${Math.floor(v / 60)}:${String(Math.floor(v % 60)).padStart(2, '0')}`;
  $('#time').textContent = `${f(t)} / ${f(TOTAL)}`;
  document.querySelectorAll('#chips button').forEach((b, k) => b.classList.toggle('on', k === i));
}
function loop() { if (!playing) return; const t = now(); if (t >= TOTAL - .02) { pause(); clockT = TOTAL; render(TOTAL); return; } render(t); requestAnimationFrame(loop); }
function play() {
  if (clockT >= TOTAL - .05) clockT = 0;
  track.currentTime = clockT; playing = true;
  track.play().catch(() => { playing = false; playBtn.textContent = '▶'; });
  playBtn.textContent = '❚❚'; big.hidden = true; requestAnimationFrame(loop);
}
function pause() { clockT = now(); playing = false; track.pause(); playBtn.textContent = '▶'; render(clockT); }
function seek(t) { clockT = cl(t, 0, TOTAL); track.currentTime = clockT; render(clockT); }
track.addEventListener('waiting', () => playBtn.textContent = '…');
track.addEventListener('playing', () => { if (playing) playBtn.textContent = '❚❚'; });
track.addEventListener('ended', () => { if (playing) pause(); });
playBtn.onclick = () => playing ? pause() : play();
big.onclick = play;
scrub.oninput = () => seek(+scrub.value);
addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'BUTTON') { e.preventDefault(); playing ? pause() : play(); } });
SEG.forEach(s => { const b = document.createElement('button'); b.textContent = s.name || s.id; b.onclick = () => seek(s.t0 + .01); $('#chips').appendChild(b); });

function fit() {
  const wrap = $('#wrap');
  if (RENDER) { wrap.style.width = W + 'px'; wrap.style.height = H + 'px'; stage.style.transform = 'none'; return; }
  const ctrl = $('.controls').offsetHeight + 40;
  const avW = Math.min(document.body.clientWidth - 32, W > H ? 1100 : 560), avH = innerHeight - ctrl;
  const sc = Math.max(.15, Math.min(avW / W, avH / H));
  wrap.style.width = W * sc + 'px'; wrap.style.height = H * sc + 'px'; stage.style.transform = `scale(${sc})`;
}
if (RENDER) document.body.classList.add('render');
addEventListener('resize', fit); fit();
/* dipakai scripts/venturo.py (shots & render): render frame t lalu tunggu video selesai seek */
window.__render = t => { render(t); track.currentTime = Math.min(t, TOTAL - .02); };
window.__renderAsync = async t => {
  render(t); track.currentTime = Math.min(t, TOTAL - .02);
  const vids = [track, ...SEG.filter(s => s.el.style.display === 'block').flatMap(s => s.vids)];
  await Promise.all(vids.map(v => (v.seeking || v.readyState < 2) ? new Promise(res => { const d = () => { v.removeEventListener('seeked', d); v.removeEventListener('loadeddata', d); res(); }; v.addEventListener('seeked', d); v.addEventListener('loadeddata', d); setTimeout(res, 3000); }) : null));
  if (document.fonts) await document.fonts.ready;
  return true;
};
window.__meta = () => ({ w: W, h: H, total: TOTAL });
document.fonts && document.fonts.ready.then(() => render(clockT));
render(0);
</script>
